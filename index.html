<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prafull Kumar - Android Developer Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        :root[data-theme="light"] {
            --primary: #2563eb;
            --primary-light: #3b82f6;
            --bg-primary: #ffffff;
            --bg-secondary: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --card-bg: #ffffff;
            --header-bg: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            --skill-bg: #f1f5f9;
            --skill-text: #2563eb;
        }

        :root[data-theme="dark"] {
            --primary: #60a5fa;
            --primary-light: #93c5fd;
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --card-bg: #1e293b;
            --header-bg: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            --skill-bg: #334155;
            --skill-text: #60a5fa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            line-height: 1.7;
            color: var(--text-primary);
            background-color: var(--bg-primary);
            transition: all 0.3s ease;
        }

        .theme-switch-wrapper {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--card-bg);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .theme-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .theme-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--bg-secondary);
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: var(--primary);
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--bg-secondary);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        .theme-icon {
            color: var(--text-secondary);
            font-size: 1.2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        header {
            position: relative;
            text-align: center;
            padding: 6rem 0 4rem;
            background: var(--header-bg);
            border-radius: 0 0 3rem 3rem;
            margin-bottom: 4rem;
        }

        .profile-img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            margin-bottom: 1.5rem;
            object-fit: cover;
            border: 4px solid var(--card-bg);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .profile-img:hover {
            transform: scale(1.05);
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            font-size: 1.25rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-weight: 500;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .social-links a {
            color: var(--text-primary);
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            background: var(--card-bg);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .social-links a:hover {
            background: var(--primary);
            color: var(--bg-primary);
        }

        footer {
            text-align: center;
            padding: 3rem 0;
            background: var(--bg-secondary);
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="theme-switch-wrapper">
        <i class="fas fa-sun theme-icon"></i>
        <label class="theme-switch">
            <input type="checkbox" checked>
            <span class="slider"></span>
        </label>
        <i class="fas fa-moon theme-icon"></i>
    </div>

    <div class="container">
        <header>
            <img src="https://avatars.githubusercontent.com/u/129758522?v=4" alt="Prafull Kumar's Profile" class="profile-img">
            <h1>Prafull Kumar</h1>
            <p class="tagline">Android Developer | Mobile App Enthusiast</p>
            <div class="social-links">
                <a href="https://github.com/prafullKrRj" target="_blank"><i class="fab fa-github"></i> GitHub</a>
                <a href="https://linkedin.com/in/prafull-kumar-rajput" target="_blank"><i class="fab fa-linkedin"></i> LinkedIn</a>
                <a href="mailto:prafullkumar384@gmail.com"><i class="fas fa-envelope"></i> Email</a>
            </div>
        </header>

        <footer>
            <p>© 2024 Prafull Kumar. All rights reserved.</p>
        </footer>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeSwitch = document.querySelector('.theme-switch input');
            themeSwitch.addEventListener('change', () => {
                const theme = themeSwitch.checked ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', theme);
            });
        });
    </script>
</body>
</html>
