<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Prafull Kumar - Android Developer & Mobile Innovator. Passionate about Kotlin, Jetpack Compose, and modern Android development." />
    <meta name="keywords" content="Android Developer, Kotlin, Jetpack Compose, Mobile Development, Portfolio" />
    <meta name="author" content="Prafull Kumar" />
    <meta property="og:title" content="Prafull Kumar - Portfolio" />
    <meta property="og:description" content="Android Developer & Mobile Innovator specializing in Kotlin and Jetpack Compose" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://prafullkumar.com" />
    <title>Prafull Kumar - Portfolio</title>
    <style>
        /* Prevent flash of unstyled content */
        body {
            margin: 0;
            background: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        }
        #root {
            min-height: 100vh;
        }
        /* Loading spinner */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #60a5fa;
            font-size: 18px;
            z-index: 9999;
        }
        .spinner {
            border: 2px solid #1e293b;
            border-top: 2px solid #60a5fa;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div id="root">
    <div class="loading">
        <div class="spinner"></div>
        Loading Portfolio...
    </div>
</div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
